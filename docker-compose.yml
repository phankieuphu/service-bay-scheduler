services:
  customer-service:
    build:
      context: ./customer-service
      dockerfile: Dockerfile
    container_name: customer-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: customer_db
      DB_SSLMODE: disable
      API_PORT: 8080
      KAFKA_BROKERS: kafka:29092
      KAFKA_PRODUCER_TOPIC: customer.events
      KAFKA_CONSUMER_TOPIC: identity.user-events
      KAFKA_CONSUMER_GROUP: customer-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Must match identity-service's: access tokens are verified with it.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "8080:8080"
    networks:
      - backend
  vehicle-service:
    build:
      context: ./vehicle-service
      dockerfile: Dockerfile 
    container_name: vehicle-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: vehicle_db
      DB_SSLMODE: disable
      API_PORT: 8081
      KAFKA_BROKERS: kafka:29092
      KAFKA_PRODUCER_TOPIC: vehicle.events
      KAFKA_CONSUMER_TOPIC: identity.user-events
      KAFKA_CONSUMER_GROUP: vehicle-service
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Must match identity-service's: access tokens are verified with it.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "8081:8081"
    networks:
      - backend
  identity-service:
    build:
      context: ./identity-service
      dockerfile: Dockerfile
    container_name: identity-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: identity_db
      DB_SSLMODE: disable
      API_PORT: 8083
      KAFKA_BROKERS: kafka:29092
      KAFKA_PRODUCER_TOPIC: identity.user-events
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Local-dev only. Services that validate access tokens themselves
      # must share this value.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      # Plain HTTP locally: Safari and Postman won't store a Secure cookie
      # from http://localhost.
      AUTH_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Local-dev only: creates this ADMIN on first start if none exists.
      ADMIN_EMAIL: admin@servicebay.local
      ADMIN_PASSWORD: admin-local-dev-pass
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "8083:8083"
    networks:
      - backend

  scheduler-service:
    build:
      context: ./scheduler-service
      dockerfile: Dockerfile
    container_name: scheduler-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: scheduler_db
      DB_SSLMODE: disable
      API_PORT: 8085
      KAFKA_BROKERS: kafka:29092
      # Booking checks the caller's profile and vehicles with these,
      # forwarding the caller's own access token.
      CUSTOMER_API_URL: http://customer-service:8080/api/v1
      VEHICLE_API_URL: http://vehicle-service:8081/api/v1
      # Must match identity-service's: access tokens are verified with it.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      # The catalog's currency, stamped on every event. Must match
      # billing-service's BILLING_CURRENCY.
      CATALOG_CURRENCY: ${CATALOG_CURRENCY:-USD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/readyz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
    ports:
      - "8085:8085"
    networks:
      - backend

  billing-service:
    build:
      context: ./billing-service
      dockerfile: Dockerfile
    container_name: billing-service
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: billing_db
      DB_SSLMODE: disable
      API_PORT: 8084
      KAFKA_BROKERS: kafka:29092
      # Must match identity-service's: access tokens are verified with it,
      # and billing signs its own service token for vehicle-service with it.
      JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
      CUSTOMER_API_URL: http://customer-service:8080/api/v1
      VEHICLE_API_URL: http://vehicle-service:8081/api/v1
      SCHEDULER_API_URL: http://scheduler-service:8085/api/v1
      # Stripe test-mode keys, from the shell or the root .env (gitignored).
      # Unset: payment endpoints answer 503 and everything else still runs.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_RETURN_URL: ${STRIPE_RETURN_URL:-http://localhost:5173/}
      # Empty = api.stripe.com; set to point at stripe-mock for local runs.
      STRIPE_API_BASE: ${STRIPE_API_BASE:-}
      # Placeholders until business-requirement §10 #5 (deposit) and #6
      # (warranty fee) are decided.
      BILLING_CURRENCY: ${CATALOG_CURRENCY:-USD}
      BILLING_WARRANTY_FEE: ${BILLING_WARRANTY_FEE:-50.00}
      DEPOSIT_POLICY: ${DEPOSIT_POLICY:-PERCENT}
      DEPOSIT_VALUE: ${DEPOSIT_VALUE:-20}
    healthcheck:
      # The JRE image has no curl, and its /bin/sh (dash) has no /dev/tcp,
      # so ask readiness over bash's /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/8084
          && printf 'GET /actuator/health/readiness HTTP/1.0\r\n\r\n' >&3
          && grep -q '"status":"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s
    ports:
      - "8084:8084"
    networks:
      - backend

  postgres:
    image: postgres:18
    container_name: postgres
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend

  # Dev-only: loads postgres/seed into customer_db and vehicle_db once the
  # services' migrations have created the tables, then exits. Skips tables
  # that already have rows. Leave it out with --scale db-seed=0.
  db-seed:
    image: postgres:16
    container_name: db-seed
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
    volumes:
      - ./postgres/seed:/seed:ro
    entrypoint: ["sh", "/seed/seed.sh"]
    restart: "no"
    networks:
      - backend

  kafka:
    image: confluentinc/cp-kafka:8.3.2
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend

  redis:
    image: redis:8.10-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend

  flink-jobmanager:
    image: flink:2.3-java17
    container_name: flink-jobmanager
    command: jobmanager
    depends_on:
      kafka:
        condition: service_started
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    ports:
      - "8082:8081"
    networks:
      - backend

  flink-taskmanager:
    image: flink:2.3-java17
    container_name: flink-taskmanager
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
    networks:
      - backend

  # Metrics exporters for the stateful infra (scraped by prometheus/prometheus.yml).
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
    container_name: postgres-exporter
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=disable
      DATA_SOURCE_USER: postgres
      DATA_SOURCE_PASS: postgres
    networks:
      - backend

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: kafka-exporter
    # exits if the broker isn't up yet
    restart: on-failure
    depends_on:
      - kafka
    command: ["--kafka.server=kafka:29092", "--offset.show-all"]
    networks:
      - backend

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/secrets:/etc/prometheus/secrets:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:13.2.3
    container_name: grafana
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # same dashboard files k8s ships as the grafana-dashboards ConfigMap
      - ./k8s/base/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    networks:
      - backend

  loki:
    image: grafana/loki:3.7.8
    container_name: loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks:
      - backend

  alloy:
    image: grafana/alloy:v1.20.1
    container_name: alloy
    depends_on:
      - loki
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "12345:12345"
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  kafka_data:
  loki_data:
