apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
  namespace: service-bay
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: identity_db
  DB_SSLMODE: disable
  API_PORT: "8083"
  KAFKA_BROKERS: kafka:9092
  KAFKA_PRODUCER_TOPIC: identity.user-events
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: identity-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: identity-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-jwt
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: service-bay
spec:
  type: NodePort
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
