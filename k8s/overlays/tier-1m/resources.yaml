# CPU/memory for the 1M tier. Strategic-merge patches: containers and env
# entries merge by name, so only the fields listed here change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: customer-service
          env:
            - name: GOMEMLIMIT
              value: "326MiB"
          resources:
            requests: { cpu: "500m", memory: "384Mi" }
            limits: { cpu: "1", memory: "384Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vehicle-service
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: vehicle-service
          env:
            - name: GOMEMLIMIT
              value: "326MiB"
          resources:
            requests: { cpu: "500m", memory: "384Mi" }
            limits: { cpu: "1", memory: "384Mi" }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: postgres
          args:
            - -c
            - max_connections=100
            - -c
            - shared_buffers=2GB
            - -c
            - effective_cache_size=6GB
          resources:
            requests: { cpu: "2", memory: "8Gi" }
            limits: { cpu: "2", memory: "8Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: redis
          args: [redis-server, --maxmemory, 768mb, --maxmemory-policy, allkeys-lru, --save, "", --appendonly, "no"]
          resources:
            requests: { cpu: "250m", memory: "1Gi" }
            limits: { cpu: "250m", memory: "1Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: kafka
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms2g -Xmx2g"
          resources:
            requests: { cpu: "1", memory: "4Gi" }
            limits: { cpu: "1", memory: "4Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: zookeeper
          env:
            - name: KAFKA_HEAP_OPTS
              value: "-Xms256m -Xmx256m"
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "250m", memory: "512Mi" }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-config
  namespace: service-bay
data:
  FLINK_PROPERTIES: |
    jobmanager.rpc.address: flink-jobmanager
    taskmanager.numberOfTaskSlots: 2
    metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
    metrics.reporter.prom.port: 9249
    # Must equal each container's memory limit; Flink splits it up internally.
    jobmanager.memory.process.size: 2048m
    taskmanager.memory.process.size: 4096m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: jobmanager
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "2Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: service-bay
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: taskmanager
          resources:
            requests: { cpu: "2", memory: "4Gi" }
            limits: { cpu: "4", memory: "4Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: prometheus
          resources:
            requests: { cpu: "1", memory: "3Gi" }
            limits: { cpu: "2", memory: "3Gi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: service-bay
spec:
  template:
    spec:
      containers:
        - name: grafana
          resources:
            requests: { cpu: "250m", memory: "256Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
