apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: service-bay
---
# Namespace-scoped: Alloy only needs to discover and read logs of pods in service-bay.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy
  namespace: service-bay
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy
  namespace: service-bay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: service-bay
---
# One replica is enough: loki.source.kubernetes tails via the API server, not node-local files.
# Scaling this up without enabling Alloy clustering would ship every line twice.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.10.2
          args:
            - run
            - --server.http.listen-addr=0.0.0.0:12345
            - --storage.path=/var/lib/alloy/data
            - /etc/alloy/config.alloy
          ports:
            - containerPort: 12345
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: alloy
  namespace: service-bay
spec:
  selector:
    app: alloy
  ports:
    - port: 12345
      targetPort: 12345
