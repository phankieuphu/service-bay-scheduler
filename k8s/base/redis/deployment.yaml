apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          # Pure cache: persistence off, LRU eviction. maxmemory is ~75% of the
          # memory limit, leaving room for Redis's own overhead.
          args:
            - redis-server
            - --maxmemory
            - 48mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - ""
            - --appendonly
            - "no"
          # limits = requests -> Guaranteed QoS, evicted last
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: service-bay
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
