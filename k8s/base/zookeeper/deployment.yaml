apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          ports:
            - containerPort: 2181
          env:
            # cp-zookeeper's default heap (512M) would not fit in a 256Mi limit.
            - name: KAFKA_HEAP_OPTS
              value: "-Xms128m -Xmx128m"
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  namespace: service-bay
spec:
  selector:
    app: zookeeper
  ports:
    - port: 2181
      targetPort: 2181
