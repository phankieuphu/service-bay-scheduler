apiVersion: v1
kind: ConfigMap
metadata:
  name: identity-service-config
  namespace: service-bay
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: identity_db
  DB_SSLMODE: disable
  API_PORT: "8083"
  KAFKA_BROKERS: kafka:9092
  KAFKA_PRODUCER_TOPIC: identity.user-events
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
        - name: identity-service
          image: identity-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          # /healthz only says the process is up; /readyz also checks
          # Postgres (and Redis for identity-service). Liveness must not use
          # /readyz, or a database outage would restart every pod.
          startupProbe:
            httpGet: { path: /healthz, port: 8083 }
            periodSeconds: 2
            failureThreshold: 30   # up to 60s to connect to Postgres/Kafka
          livenessProbe:
            httpGet: { path: /healthz, port: 8083 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: 8083 }
            periodSeconds: 10
            timeoutSeconds: 3      # the checks themselves time out at 2s
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: identity-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-jwt
                  key: JWT_SECRET
            - name: GOMEMLIMIT # ~85% of the memory limit, so the GC works harder before an OOM kill
              value: "108MiB"
          # Login and register are bcrypt-bound (cost 12, ~250ms of CPU each),
          # so the CPU limit is higher than the other services' to absorb bursts.
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: service-bay
spec:
  type: NodePort
  selector:
    app: identity-service
  ports:
    - port: 8083
      targetPort: 8083
      nodePort: 30083
