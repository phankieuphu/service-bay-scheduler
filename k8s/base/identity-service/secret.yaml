# Local-cluster value, same as docker-compose.yml. Replace with a real
# secret (and keep it out of git) for any shared environment.
# identity-service signs access tokens with JWT_SECRET; customer-service and
# vehicle-service read the same key to verify them; scheduler-service and
# billing-service too, and billing also signs its own service token with it.
apiVersion: v1
kind: Secret
metadata:
  name: identity-jwt
  namespace: service-bay
type: Opaque
stringData:
  JWT_SECRET: local-dev-jwt-secret-change-me-0123456789
