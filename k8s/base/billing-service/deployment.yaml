apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: service-bay
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: billing_db
  DB_SSLMODE: disable
  API_PORT: "8084"
  KAFKA_BROKERS: kafka:9092
  DB_MAX_OPEN_CONNS: "10"
  CUSTOMER_API_URL: http://customer-service:8080/api/v1
  VEHICLE_API_URL: http://vehicle-service:8081/api/v1
  SCHEDULER_API_URL: http://scheduler-service:8085/api/v1
  # Must match scheduler-service's CATALOG_CURRENCY.
  BILLING_CURRENCY: USD
  # Placeholders until business-requirement §10 #5 and #6 are decided.
  BILLING_WARRANTY_FEE: "50.00"
  DEPOSIT_POLICY: PERCENT
  DEPOSIT_VALUE: "20"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Matches server.shutdown=graceful plus SHUTDOWN_TIMEOUT (15s).
      terminationGracePeriodSeconds: 30
      containers:
        - name: billing-service
          image: billing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 3
            failureThreshold: 40   # the JVM plus Flyway get up to 2 min
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Includes Postgres; liveness doesn't, so a database outage takes
            # the pod out of rotation instead of restarting it.
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: identity-jwt
                  key: JWT_SECRET
            # Stripe test-mode keys, never committed. Create them with
            #   kubectl -n service-bay create secret generic billing-stripe \
            #     --from-literal=STRIPE_SECRET_KEY=sk_test_... \
            #     --from-literal=STRIPE_PUBLISHABLE_KEY=pk_test_... \
            #     --from-literal=STRIPE_WEBHOOK_SECRET=whsec_...
            # Optional: without it the pod starts and payment endpoints answer 503.
            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef: { name: billing-stripe, key: STRIPE_SECRET_KEY, optional: true }
            - name: STRIPE_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef: { name: billing-stripe, key: STRIPE_PUBLISHABLE_KEY, optional: true }
            - name: STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef: { name: billing-stripe, key: STRIPE_WEBHOOK_SECRET, optional: true }
          # The heap is 75% of the memory limit (-XX:MaxRAMPercentage=75 in
          # the image). The JVM's CPU burst at startup is why the CPU limit is
          # well above the request.
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: service-bay
spec:
  type: NodePort
  selector:
    app: billing-service
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
