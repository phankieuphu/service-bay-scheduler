apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-service-config
  namespace: service-bay
data:
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: billing_db
  DB_SSLMODE: disable
  API_PORT: "8084"
  KAFKA_BROKERS: kafka:9092
  DB_MAX_OPEN_CONNS: "10"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-service
  namespace: service-bay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: billing-service
  template:
    metadata:
      labels:
        app: billing-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8084"
        prometheus.io/path: /actuator/prometheus
    spec:
      # Matches server.shutdown=graceful plus SHUTDOWN_TIMEOUT (15s).
      terminationGracePeriodSeconds: 30
      containers:
        - name: billing-service
          image: billing-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 3
            failureThreshold: 40   # the JVM plus Flyway get up to 2 min
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Includes Postgres; liveness doesn't, so a database outage takes
            # the pod out of rotation instead of restarting it.
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: billing-service-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # The heap is 75% of the memory limit (-XX:MaxRAMPercentage=75 in
          # the image). The JVM's CPU burst at startup is why the CPU limit is
          # well above the request.
          resources:
            requests:
              cpu: "100m"
              memory: "384Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: billing-service
  namespace: service-bay
spec:
  type: NodePort
  selector:
    app: billing-service
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
