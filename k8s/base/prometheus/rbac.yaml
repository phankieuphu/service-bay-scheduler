# Read-only pod discovery for prometheus' kubernetes-pods job, scoped to this
# namespace (a Role, not a ClusterRole).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  namespace: service-bay
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prometheus
  namespace: service-bay
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prometheus
  namespace: service-bay
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: service-bay
