spring.application.name=billing_service
server.port=${SERVER_PORT:8084}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is owned by postgres/init/06-billing-service.sql; Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
