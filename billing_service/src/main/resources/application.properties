spring.application.name=billing_service
server.port=${SERVER_PORT:8084}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:billing_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is owned by postgres/init/06-billing-service.sql; Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Payloads are JSON strings on both sides: the relay publishes outbox_message.payload
# as-is, and the consumer parses the envelope itself so a bad message can be skipped.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:billing-service}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# payment-service's events (architecture-design.md §3d). Never billing's own topic.
billing.kafka.payment-succeeded-topic=${KAFKA_PAYMENT_SUCCEEDED_TOPIC:payment.payment.succeeded.v1}
billing.kafka.payment-failed-topic=${KAFKA_PAYMENT_FAILED_TOPIC:payment.payment.failed.v1}

# Currency every bill is charged in. Stripe zero-decimal currencies (e.g. vnd) are handled.
billing.currency=${BILLING_CURRENCY:usd}

# Warranty/expiration fee (business-requirement.md §6), charged by checkout only when
# the vehicle's warranty has expired or it has none. The amount is still an open
# question (business-requirement.md §10 #6); this is a placeholder in billing.currency.
billing.warranty-fee=${BILLING_WARRANTY_FEE:50.00}
# The hub's business day: "today" for warranty checks when checkout gets no serviceDate.
billing.time-zone=${BILLING_TIME_ZONE:Asia/Ho_Chi_Minh}

# Checked by POST /api/v1/bills/checkout.
customer-service.url=${CUSTOMER_SERVICE_URL:http://localhost:8080}
vehicle-service.url=${VEHICLE_SERVICE_URL:http://localhost:8081}
upstream.connect-timeout=2s
upstream.read-timeout=5s

payment-service.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
payment-service.connect-timeout=2s
# Covers payment-service's own round trip to Stripe.
payment-service.read-timeout=15s

outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}
outbox.batch-size=100
