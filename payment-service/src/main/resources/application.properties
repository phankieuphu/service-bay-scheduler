spring.application.name=payment_service
server.port=${SERVER_PORT:8085}
management.endpoints.web.exposure.include=health,info

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Schema is owned by postgres/init/11-payment-service.sql; Hibernate must not touch it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Producer only: the outbox relay publishes the JSON payload stored in outbox_message as-is.
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all

outbox.relay-interval-ms=${OUTBOX_RELAY_INTERVAL_MS:2000}
outbox.batch-size=100

# Leave both empty to run without Stripe: card endpoints then answer 503.
# Use test-mode keys (sk_test_...) outside production.
stripe.secret-key=${STRIPE_SECRET_KEY:}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Empty = api.stripe.com. Set to e.g. http://localhost:12111 to use stripe-mock.
stripe.api-base=${STRIPE_API_BASE:}
