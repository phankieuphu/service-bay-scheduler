# Build, vet and test every Go service, build and lint the frontend, build
# the Docker images, and check that postgres/init runs on an empty database.
# Plain GitHub Actions (not gh-aw): there's no .md source to compile.
name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: go (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [customer-service, vehicle-service, identity-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint

  docker:
    name: docker (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [customer-service, vehicle-service, identity-service]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        run: docker buildx build --load -t ${{ matrix.service }}:ci ${{ matrix.service }}

  postgres-init:
    # The init scripts only run on an empty data volume, so a broken one
    # otherwise shows up as a postgres container that exits on a fresh
    # checkout (#50). Mounts the same files docker-compose.yml does.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run postgres/init and seeds on an empty database
        run: |
          image=$(sed -n 's/^ *image: \(postgres:.*\)$/\1/p' docker-compose.yml | head -1)
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres \
            -v "$PWD/postgres/init:/docker-entrypoint-initdb.d:ro" \
            -v "$PWD/postgres/seed/init-customer.sql:/docker-entrypoint-initdb.d/09-seed-customer.sql:ro" \
            -v "$PWD/postgres/seed/init-vehicle.sql:/docker-entrypoint-initdb.d/10-seed-vehicle.sql:ro" \
            "$image"
          for _ in $(seq 1 90); do
            if [ "$(docker inspect -f '{{.State.Running}}' pg)" != "true" ]; then
              echo "::error::postgres exited while running the init scripts"
              docker logs pg
              exit 1
            fi
            if docker logs pg 2>&1 | grep -q "PostgreSQL init process complete" \
              && docker exec pg pg_isready -U postgres >/dev/null; then
              docker exec pg psql -U postgres -Atc "SELECT datname FROM pg_database ORDER BY 1"
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres did not become ready in 180s"
          docker logs pg
          exit 1
